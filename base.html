<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}همراه‌پزشک{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar"><a class="brand" href="{{ url_for('index') }}">✚ همراه‌پزشک</a>
<nav><a href="{{ url_for('index') }}">خانه</a><a href="{{ url_for('clinician') }}">پنل پزشک (دمو)</a></nav></header>
<main class="container">
  {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="notice">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>نسخه نمایشی آموزشی — برای تشخیص، تجویز یا درمان واقعی استفاده نشود.</footer>
</body></html>
